name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v2

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease --no-daemon

    - name: Sign APK
      run: |
        keytool -genkey -v -keystore release.keystore -alias mykey -keyalg RSA           -keysize 2048 -validity 10000 -storepass android123 -keypass android123           -dname "CN=App, OU=App, O=Company, L=City, S=State, C=US"
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256           -keystore release.keystore -storepass android123 -keypass android123           app/build/outputs/apk/release/app-release-unsigned.apk mykey
        cp app/build/outputs/apk/release/app-release-unsigned.apk app-release.apk

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: app-release
        path: app-release.apk
        retention-days: 1
