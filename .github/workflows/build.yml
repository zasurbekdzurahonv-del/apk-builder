name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: "17"
        distribution: temurin
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    - name: Accept licenses
      run: yes | sdkmanager --licenses || true
    - name: Install build tools
      run: sdkmanager "build-tools;34.0.0" "platforms;android-34"
    - name: Make gradlew executable
      run: chmod +x gradlew
    - name: Build APK
      run: ./gradlew assembleRelease --no-daemon
    - name: Sign APK
      run: |
        keytool -genkey -v -keystore release.keystore -alias mykey -keyalg RSA -keysize 2048 -validity 10000 -storepass android123 -keypass android123 -dname "CN=App, O=App, C=US"
        jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore -storepass android123 -keypass android123 app/build/outputs/apk/release/app-release-unsigned.apk mykey
        cp app/build/outputs/apk/release/app-release-unsigned.apk app-release.apk
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app-release.apk
        retention-days: 1
