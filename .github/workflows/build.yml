name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin
    - name: Build
      run: |
        export ANDROID_HOME=/usr/local/lib/android/sdk
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" || true
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs=-Xmx1g
    - uses: actions/upload-artifact@v4
      with:
        name: app-unsigned
        path: app/build/outputs/apk/release/app-release-unsigned.apk
        retention-days: 7
